[project]
name = "breeze-tts"
version = "0.1.0"
description = "PyTorch inference code for Breeze TTS 2"
requires-python = ">=3.10"
dependencies = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "qwen-tts==0.1.1",
    "transformers==4.57.3",
    "numpy>=2.0",
    "soundfile>=0.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.uv]
package = false